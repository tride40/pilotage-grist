<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Création et suivi des consignes politiques par projet"><title>Consignes politiques</title>
    <link rel="stylesheet" href="../commun/theme.css"><link rel="stylesheet" href="../commun/components.css?v=11"><link rel="stylesheet" href="styles.css?v=7">
    <script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script><script src="../commun/current-user.js?v=2" defer></script><script src="../commun/context.js?v=2" defer></script><script src="../commun/v3-rules.js?v=3" defer></script><script src="demo-data.js?v=6" defer></script><script src="app.js?v=10" defer></script>
  </head>
  <body>
    <header class="instructions-header app-header"><div class="instructions-header__content app-header__inner"><div><p class="section-kicker">Pilotage politique</p><h1>Consignes</h1></div><div class="header-actions"><a class="button button--secondary project-return-button" id="project-return" target="_top" aria-label="Retour à la fiche du projet sélectionné" hidden>← Fiche projet</a><a class="button button--secondary home-button" href="https://grist.numerique.gouv.fr/o/docs/f8iwcexDATAw/Pilotage-des-projets/p/16" target="_top" aria-label="Revenir à l’accueil"><span class="home-button__icon" aria-hidden="true">⌂</span>Accueil</a><button class="button button--primary" id="open-create" type="button">+ Nouvelle consigne</button></div></div></header>
    <main class="instructions-shell"><div class="widget-context card"><div><p class="section-kicker" id="context-label">Vue globale</p><strong id="context-project"></strong></div><label class="project-selector"><span>Projet</span><select id="project-selector" aria-label="Choisir un projet"></select></label></div>
      <div class="interface-state" id="interface-state" role="status" aria-live="polite"><span class="loader" aria-hidden="true"></span><div><strong>Chargement des consignes</strong><p>Lecture des données Grist en cours…</p></div></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
      <div id="instructions-content" hidden>
        <section class="instruction-section" aria-labelledby="follow-title"><div class="section-header"><div><p class="section-kicker">En cours</p><h2 class="section-header__title" id="follow-title">À suivre</h2></div><span class="badge badge--info" id="follow-count"></span></div><div class="instruction-list" id="follow-list"></div></section>
        <section class="instruction-section" aria-labelledby="history-title"><div class="section-header"><div><p class="section-kicker">Consignes traitées</p><h2 class="section-header__title" id="history-title">Historique</h2></div><span class="badge badge--success" id="history-count"></span></div><div class="instruction-list" id="history-list"></div></section>
      </div>
    </main>
    <dialog id="instruction-dialog" aria-labelledby="dialog-title"><form id="instruction-form"><div class="dialog-header"><div><p class="section-kicker">Consigne politique</p><h2 id="dialog-title">Nouvelle consigne</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div><div class="form-scroll"><label class="form-field"><span class="form-field__label">Consigne *</span><textarea class="form-field__control" name="Consigne" required placeholder="Indiquez ce dont il faut tenir compte"></textarea></label><div class="form-grid"><label class="form-field"><span class="form-field__label">Destinataires</span><select class="form-field__control" name="Destinataires" multiple size="5"></select></label><label class="form-field form-field--wide" id="services-field"><span class="form-field__label">Services destinataires</span><select class="form-field__control" name="Services_destinataires" multiple size="4"></select><small>Sélectionnez au moins une personne ou un service.</small></label></div></div><p class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Créer la consigne</button></div></form></dialog>
  </body>
</html>
