<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Création, suivi et contrôle des actions par projet"><title>Actions</title><link rel="stylesheet" href="../commun/theme.css"><link rel="stylesheet" href="../commun/components.css?v=3"><link rel="stylesheet" href="styles.css?v=6"><script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script><script src="demo-data.js?v=6" defer></script><script src="app.js?v=6" defer></script></head>
<body>
  <header class="actions-header"><div class="actions-header__content"><div><p class="section-kicker">Pilotage opérationnel</p><h1>Actions</h1><label class="project-selector"><span>Projet</span><select id="project-selector" aria-label="Choisir un projet"></select></label></div><div class="header-actions"><span class="sanguinet-brand"><img src="../commun/logo-sanguinet.svg" alt="Sanguinet — L’esprit village"></span><a class="button button--secondary home-button" href="https://grist.numerique.gouv.fr/o/docs/f8iwcexDATAw/Pilotage-des-projets/p/16" target="_top" aria-label="Revenir à l’accueil"><span class="home-button__icon" aria-hidden="true">⌂</span>Accueil</a><button class="button button--primary" id="open-create" type="button">+ Nouvelle action</button></div></div></header>
  <main class="actions-shell">
    <div class="interface-state" id="interface-state" role="status" aria-live="polite"><span class="loader" aria-hidden="true"></span><div><strong>Chargement des actions</strong><p>Lecture des données Grist en cours…</p></div></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
    <div id="actions-content" hidden>
      <div class="summary" id="summary" aria-label="Synthèse des actions"></div>
      <section class="action-section" data-section="todo" aria-labelledby="todo-title"><div class="section-header"><div><p class="section-kicker">À lancer</p><h2 class="section-header__title" id="todo-title">À faire</h2></div><span class="badge badge--info" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="progress" aria-labelledby="progress-title"><div class="section-header"><div><p class="section-kicker">Travail engagé</p><h2 class="section-header__title" id="progress-title">En cours</h2></div><span class="badge badge--info" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="overdue" aria-labelledby="overdue-title"><div class="section-header"><div><p class="section-kicker">Vigilance</p><h2 class="section-header__title" id="overdue-title">En retard</h2></div><span class="badge badge--danger" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="check" aria-labelledby="check-title"><div class="section-header"><div><p class="section-kicker">Décision attendue</p><h2 class="section-header__title" id="check-title">À contrôler</h2></div><span class="badge badge--arbitration" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="history" aria-labelledby="history-title"><div class="section-header"><div><p class="section-kicker">Actions closes</p><h2 class="section-header__title" id="history-title">Historique</h2></div><span class="badge badge--success" data-count></span></div><div class="action-list" data-list></div></section>
    </div>
  </main>
  <dialog id="action-dialog" aria-labelledby="dialog-title"><form id="action-form"><div class="dialog-header"><div><p class="section-kicker">Nouvelle action</p><h2 id="dialog-title">Créer une action</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div><label class="form-field"><span class="form-field__label">Action *</span><textarea class="form-field__control" name="Action" required placeholder="Décrivez précisément l’action attendue"></textarea></label><div class="form-grid"><label class="form-field"><span class="form-field__label">Responsable</span><select class="form-field__control" name="Responsable"><option value="">Non attribué</option></select></label><label class="form-field"><span class="form-field__label">Type d’action</span><select class="form-field__control" name="Type_action"><option>Suivi</option><option>Décision</option><option>Production</option><option>Coordination</option><option>Communication</option><option>Autre</option></select></label><label class="form-field"><span class="form-field__label">Priorité</span><select class="form-field__control" name="Priorite"><option>Normale</option><option>Haute</option><option>Urgente</option><option>Basse</option></select></label><label class="form-field"><span class="form-field__label">Échéance</span><input class="form-field__control" name="Echeance" type="date"></label><label class="form-field form-field--check"><input name="Controle_requis" type="checkbox"><span>Contrôle de l’élu requis</span></label></div><div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Créer l’action</button></div></form></dialog>
</body></html>
