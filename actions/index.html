<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="To-do partagée des projets"><title>Actions</title><link rel="stylesheet" href="../commun/theme.css"><link rel="stylesheet" href="../commun/components.css?v=11"><link rel="stylesheet" href="styles.css?v=12"><script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script><script src="../commun/current-user.js?v=2" defer></script><script src="../commun/context.js?v=2" defer></script><script src="../commun/v3-rules.js?v=9" defer></script><script src="demo-data.js?v=8" defer></script><script src="app.js?v=15" defer></script></head>
<body>
  <header class="actions-header app-header"><div class="actions-header__content app-header__inner"><div><p class="section-kicker">Pilotage opérationnel</p><h1>Actions</h1></div><div class="header-actions"><a class="button button--secondary project-return-button" id="project-return" target="_top" aria-label="Retour à la fiche du projet sélectionné" hidden>← Fiche projet</a><a class="button button--secondary home-button" href="https://grist.numerique.gouv.fr/o/docs/f8iwcexDATAw/Pilotage-des-projets/p/16" target="_top" aria-label="Revenir à l’accueil"><span class="home-button__icon" aria-hidden="true">⌂</span>Accueil</a><button class="button button--primary" id="open-create" type="button">+ Nouvelle action</button></div></div></header>
  <main class="actions-shell"><div class="widget-context card"><div><p class="section-kicker" id="context-label">Vue globale</p><strong id="context-project"></strong></div><label class="project-selector"><span>Projet</span><select id="project-selector" aria-label="Choisir un projet"></select></label></div>
    <div class="interface-state" id="interface-state" role="status" aria-live="polite"><span class="loader" aria-hidden="true"></span><div><strong>Chargement des actions</strong><p>Lecture des données Grist en cours…</p></div></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div>
    <div id="actions-content" hidden><div class="action-sort card"><label class="form-field"><span class="form-field__label">Trier les actions</span><select class="form-field__control" id="action-sort"><option value="due">Échéance la plus proche</option><option value="created">Date de création la plus récente</option></select></label></div>
      <div class="summary" id="summary" aria-label="Synthèse des actions"></div>
      <section class="action-section" data-section="todo" aria-labelledby="todo-title"><div class="section-header"><div><p class="section-kicker">À lancer</p><h2 class="section-header__title" id="todo-title">À faire</h2></div><span class="badge badge--info" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="progress" aria-labelledby="progress-title"><div class="section-header"><div><p class="section-kicker">Travail engagé</p><h2 class="section-header__title" id="progress-title">En cours</h2></div><span class="badge badge--info" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="overdue" aria-labelledby="overdue-title"><div class="section-header"><div><p class="section-kicker">Vigilance</p><h2 class="section-header__title" id="overdue-title">En retard</h2></div><span class="badge badge--danger" data-count></span></div><div class="action-list" data-list></div></section>
      <section class="action-section" data-section="history" aria-labelledby="history-title"><div class="section-header"><div><p class="section-kicker">Actions closes</p><h2 class="section-header__title" id="history-title">Historique</h2></div><span class="badge badge--success" data-count></span></div><div class="action-list" data-list></div></section>
    </div>
  </main>
  <dialog id="action-dialog" aria-labelledby="dialog-title"><form id="action-form"><div class="dialog-header"><div><p class="section-kicker">Nouvelle action</p><h2 id="dialog-title">Créer une action</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div><div class="form-scroll"><label class="form-field"><span class="form-field__label">Action *</span><textarea class="form-field__control" name="Action" required placeholder="Décrivez précisément ce qui doit être fait"></textarea></label><div class="form-grid"><div class="person-picker" data-person-picker="Attribuee_a"><label class="form-field"><span class="form-field__label">Attribuée à</span><input class="form-field__control" type="search" data-person-search placeholder="Rechercher par nom, fonction ou organisme…" autocomplete="off"></label><input type="hidden" name="Attribuee_a"><div class="person-picker__results" data-person-results role="listbox" hidden></div></div><label class="form-field"><span class="form-field__label">Service destinataire</span><select class="form-field__control" name="Service_destinataire"><option value="">Aucun service</option></select></label><label class="form-field"><span class="form-field__label">Échéance facultative</span><input class="form-field__control" name="Echeance" type="date"></label></div></div><div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Créer l’action</button></div></form></dialog>
</body></html>
