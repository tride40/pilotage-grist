<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tableau de bord du pilotage des projets">
    <title>Pilotage des projets</title>
    <link rel="stylesheet" href="../commun/theme.css">
    <link rel="stylesheet" href="../commun/components.css">
    <link rel="stylesheet" href="style.css?v=4">
    <script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script>
    <script src="demo-data.js?v=4" defer></script>
    <script src="app.js?v=4" defer></script>
  </head>
  <body>
    <header class="dashboard-header">
      <div class="dashboard-header__content">
        <div>
          <p class="dashboard-header__eyebrow">Tableau de bord</p>
          <h1>Pilotage des projets</h1>
          <p class="dashboard-header__subtitle">Vue d'ensemble de l'activité</p>
        </div>
        <time class="dashboard-date" id="current-date"></time>
      </div>
    </header>

    <main class="app-shell dashboard">
      <section aria-labelledby="kpi-title">
        <h2 class="visually-hidden" id="kpi-title">Indicateurs clés</h2>
        <div class="kpi-grid" id="kpi-grid" aria-live="polite"></div>
      </section>

      <section class="projects-section" aria-labelledby="projects-title">
        <div class="section-header projects-heading">
          <div>
            <p class="section-kicker">Portefeuille</p>
            <h2 class="section-header__title" id="projects-title">Projets actifs</h2>
          </div>
          <div class="projects-heading__actions"><p class="results-count" id="results-count" aria-live="polite"></p><button class="button button--primary" id="new-project" type="button">+ Nouveau projet</button></div>
        </div>

        <div class="dashboard-toolbar" aria-label="Filtres des projets">
          <div class="filter-list" id="filter-list" role="group" aria-label="Afficher les projets">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">Tous</button>
            <button class="filter-button" type="button" data-filter="priority" aria-pressed="false">Prioritaires</button>
            <button class="filter-button" type="button" data-filter="watch" aria-pressed="false">À surveiller</button>
            <button class="filter-button" type="button" data-filter="arbitration" aria-pressed="false">Arbitrages</button>
            <button class="filter-button" type="button" data-filter="late" aria-pressed="false">Retards</button>
          </div>
          <label class="search-field" for="project-search">
            <span class="visually-hidden">Rechercher un projet par son nom</span>
            <span class="search-field__icon" aria-hidden="true">⌕</span>
            <input id="project-search" type="search" placeholder="Rechercher un projet…" autocomplete="off">
          </label>
        </div>

        <div class="interface-state" id="interface-state" role="status" aria-live="polite">
          <span class="loader" aria-hidden="true"></span>
          <div><strong>Chargement du tableau de bord</strong><p>Lecture des données Grist en cours…</p></div>
        </div>
        <div class="responsive-grid project-grid" id="project-grid" hidden></div>
      </section>
    </main>

    <div class="toast" id="feedback" role="status" aria-live="polite" hidden></div>
    <dialog id="project-dialog" aria-labelledby="project-form-title">
      <form id="project-form">
        <div class="dialog-header"><div><p class="section-kicker">Portefeuille</p><h2 id="project-form-title">Nouveau projet</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div>
        <div class="form-grid">
          <label class="form-field form-field--wide"><span class="form-field__label">Nom du projet *</span><input class="form-field__control" name="Nom_projet" required maxlength="250"></label>
          <label class="form-field form-field--wide"><span class="form-field__label">Description</span><textarea class="form-field__control" name="Description" rows="3"></textarea></label>
          <label class="form-field form-field--wide"><span class="form-field__label">Objectif politique</span><textarea class="form-field__control" name="Objectif_politique" rows="3"></textarea></label>
          <label class="form-field"><span class="form-field__label">Catégorie</span><select class="form-field__control" name="Categorie"></select></label>
          <label class="form-field"><span class="form-field__label">Statut</span><select class="form-field__control" name="Statut"></select></label>
          <label class="form-field"><span class="form-field__label">Priorité</span><select class="form-field__control" name="Priorite"></select></label>
          <label class="form-field"><span class="form-field__label">Agent pilote</span><select class="form-field__control" name="Responsable"></select></label>
          <label class="form-field"><span class="form-field__label">Élu pilote</span><select class="form-field__control" name="Elu_pilote"></select></label>
          <label class="form-field"><span class="form-field__label">Date de début</span><input class="form-field__control" name="Date_debut" type="date"></label>
          <label class="form-field"><span class="form-field__label">Échéance</span><input class="form-field__control" name="Echeance" type="date"></label>
          <label class="form-field"><span class="form-field__label">Avancement (%)</span><input class="form-field__control" name="Avancement" type="number" min="0" max="100" step="1" value="0"></label>
          <label class="form-field form-field--wide"><span class="form-field__label">Prochaine étape</span><textarea class="form-field__control" name="Prochaine_etape" rows="2"></textarea></label>
          <label class="form-field"><span class="form-field__label">Date de la prochaine étape</span><input class="form-field__control" name="Date_prochaine_etape" type="date"></label>
          <label class="form-field form-field--wide"><span class="form-field__label">Point de vigilance</span><textarea class="form-field__control" name="Point_vigilance" rows="2"></textarea></label>
        </div>
        <p class="form-message" id="project-form-message" aria-live="polite"></p>
        <div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Créer le projet</button></div>
      </form>
    </dialog>

    <template id="kpi-template">
      <article class="card kpi-card">
        <span class="kpi-card__marker" aria-hidden="true"></span>
        <div><p class="kpi-card__label"></p><p class="kpi-card__value"></p></div>
      </article>
    </template>

    <template id="project-template">
      <article class="card project-card dashboard-project-card" tabindex="0" role="link">
        <header class="project-card__header">
          <div class="project-card__identity"><p class="project-card__category"></p><h3 class="project-card__title"></h3></div>
          <div class="project-card__badges"></div>
        </header>
        <div class="project-card__progress"></div>
        <dl class="project-card__details"></dl>
        <div class="project-card__vigilance" hidden></div>
        <footer class="project-card__footer"></footer>
      </article>
    </template>
  </body>
</html>
