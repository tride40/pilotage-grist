<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Réunions liées au projet sélectionné">
    <title>Réunions du projet</title>
    <link rel="stylesheet" href="../commun/theme.css">
    <link rel="stylesheet" href="../commun/components.css">
    <link rel="stylesheet" href="styles.css?v=8">
    <script src="https://docs.getgrist.com/grist-plugin-api.js" defer></script>
    <script src="demo-data.js?v=8" defer></script>
    <script src="app.js?v=8" defer></script>
  </head>
  <body>
    <header class="meetings-header">
      <div class="meetings-header__content">
        <div>
          <p class="section-kicker">Suivi du projet</p><h1>Réunions</h1>
          <label class="project-selector"><span>Projet</span><select id="project-selector" aria-label="Choisir un projet"></select></label>
          <p class="meetings-header__project" id="project-name" hidden></p>
        </div>
        <div class="header-actions"><span class="badge badge--info" id="meeting-count">0 réunion</span><button class="button button--primary" id="new-meeting" type="button">+ Nouvelle réunion</button></div>
      </div>
    </header>
    <main class="meetings-shell">
      <div class="interface-state" id="interface-state" role="status" aria-live="polite">
        <span class="loader" aria-hidden="true"></span><div><strong>Chargement des réunions</strong><p>Lecture des données Grist en cours…</p></div>
      </div>
      <div id="meetings-content" hidden>
        <section class="responsive-grid meeting-kpis" id="meeting-kpis" aria-label="Indicateurs des réunions"></section>
        <section class="meeting-toolbar" aria-label="Filtres des réunions">
          <div class="filter-list" id="filter-list" role="group" aria-label="Afficher les réunions">
            <button class="button button--secondary filter-button" type="button" data-filter="all" aria-pressed="true">Toutes</button>
            <button class="button button--secondary filter-button" type="button" data-filter="upcoming" aria-pressed="false">À venir</button>
            <button class="button button--secondary filter-button" type="button" data-filter="past" aria-pressed="false">Passées</button>
            <button class="button button--secondary filter-button" type="button" data-filter="decisions" aria-pressed="false">Décisions</button>
          </div>
          <label class="form-field search-field"><span class="form-field__label">Rechercher</span><input class="form-field__control" id="meeting-search" type="search" placeholder="Objet, type ou point clé…" autocomplete="off"></label>
        </section>
        <div class="section-header meeting-list-header"><div><p class="section-kicker">Historique et agenda</p><h2 class="section-header__title">Réunions du projet</h2></div><p id="results-count" aria-live="polite"></p></div>
        <div class="meeting-list" id="meeting-list"></div>
      </div>
    </main>
    <div class="toast" id="feedback" role="status" aria-live="polite" hidden></div>
    <dialog id="meeting-dialog" aria-labelledby="meeting-form-title"><form id="meeting-form"><div class="dialog-header"><div><p class="section-kicker">Compte rendu</p><h2 id="meeting-form-title">Nouvelle réunion</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div><div class="form-grid" id="meeting-fields"></div><p class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Enregistrer la réunion</button></div></form></dialog>
    <dialog id="followup-dialog" aria-labelledby="followup-title"><form id="followup-form"><div class="dialog-header"><div><p class="section-kicker">Suites de la réunion</p><h2 id="followup-title">Créer une suite</h2></div><button class="icon-button" type="button" data-close aria-label="Fermer">×</button></div><input name="TargetTable" type="hidden"><div class="form-grid" id="followup-fields"></div><p class="form-message" aria-live="polite"></p><div class="dialog-actions"><button class="button button--secondary" type="button" data-close>Annuler</button><button class="button button--primary" type="submit">Créer</button></div></form></dialog>
    <template id="meeting-template">
      <article class="card meeting-card">
        <header class="meeting-card__header"><div><p class="meeting-card__date"></p><h3 class="meeting-card__title"></h3></div><div class="meeting-card__badges"></div></header>
        <dl class="meeting-card__details"></dl><div class="meeting-card__sections"></div><div class="meeting-card__actions"><button class="button button--secondary" type="button" data-edit>Modifier</button></div>
      </article>
    </template>
  </body>
</html>
